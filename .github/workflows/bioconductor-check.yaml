name: Bioconductor check

on:
  push:
  pull_request:

jobs:
  linux-bioc-devel:
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:devel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install package dependencies
        shell: bash
        run: |
          Rscript --vanilla -e '
            options(repos = BiocManager::repositories(), Ncpus = 2L)
            if (!requireNamespace("remotes", quietly = TRUE)) {
              install.packages("remotes")
            }
            remotes::install_deps(
              dependencies = c("Depends", "Imports", "Suggests"),
              upgrade = "never"
            )
          '

      - name: Build source package
        shell: bash
        run: R CMD build --keep-empty-dirs --no-resave-data .

      - name: Check source package
        shell: bash
        run: R CMD check --no-manual --timings TSSr_*.tar.gz

      - name: Upload check results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-bioc-devel-check-results
          path: |
            TSSr.Rcheck/
            TSSr_*.tar.gz
